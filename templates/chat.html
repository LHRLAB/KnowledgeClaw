{% extends "base.html" %}
{% set active = "chat" %}

{% block title %}Chat – KnowledgeClaw{% endblock %}

{% block head %}
<style>
.chat-layout {
  display: flex;
  height: calc(100vh - 56px);
  overflow: hidden;
}
.chat-sidebar {
  width: 220px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 16px 12px;
  flex-shrink: 0;
}
.chat-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.mode-tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 16px;
}
.mode-tab {
  flex: 1;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 13px;
  text-align: center;
  transition: all 0.15s;
}
.mode-tab.active {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}
.mode-tab:hover:not(.active) {
  border-color: var(--primary);
  color: var(--primary);
}
.sidebar-section { margin-bottom: 20px; }
.sidebar-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted); margin-bottom: 8px; }
.mode-desc { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
.chat-header {
  padding: 14px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.message {
  display: flex;
  flex-direction: column;
  max-width: 82%;
}
.message.user { align-self: flex-end; align-items: flex-end; }
.message.assistant { align-self: flex-start; align-items: flex-start; }
.bubble {
  padding: 12px 16px;
  border-radius: 16px;
  font-size: 14px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
}
.message.user .bubble {
  background: var(--primary);
  color: #fff;
  border-bottom-right-radius: 4px;
}
.message.assistant .bubble {
  background: var(--surface);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
}
.message-meta {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
  padding: 0 4px;
}
.sources-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 6px;
}
.source-chip {
  display: inline-block;
  background: rgba(99,102,241,0.12);
  color: var(--primary);
  border-radius: 4px;
  padding: 2px 8px;
  font-size: 11px;
}
.think-block {
  background: rgba(99,102,241,0.07);
  border-left: 3px solid var(--primary);
  padding: 8px 12px;
  font-size: 12px;
  color: var(--text-muted);
  border-radius: 0 6px 6px 0;
  margin-bottom: 8px;
  font-style: italic;
}
.chat-input-area {
  padding: 14px 20px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.chat-input-row {
  display: flex;
  gap: 10px;
  align-items: flex-end;
}
.chat-textarea {
  flex: 1;
  resize: none;
  min-height: 44px;
  max-height: 140px;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s;
  overflow-y: auto;
}
.chat-textarea:focus { border-color: var(--primary); }
.send-btn {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  border: none;
  background: var(--primary);
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: opacity 0.15s;
}
.send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.top-k-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); margin-top: 8px; }
.top-k-row input { width: 60px; }
.typing-indicator { display: flex; gap: 5px; align-items: center; padding: 12px 16px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); animation: bounce 1.2s infinite; }
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,80%,100% { transform: scale(0.6); } 40% { transform: scale(1); } }
.empty-state {
  text-align: center;
  color: var(--text-muted);
  margin: auto;
  padding: 40px;
}
.empty-state svg { opacity: 0.3; margin-bottom: 12px; }
</style>
{% endblock %}

{% block content %}
<div class="chat-layout">
  <!-- Sidebar -->
  <div class="chat-sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title" data-i18n="chat.mode.title">Mode</div>
      <div class="mode-tabs" style="flex-direction:column;">
        <button class="mode-tab active" id="tab-qa" onclick="switchMode('qa')">
          <span data-i18n="chat.mode.qa">Q&A</span>
        </button>
        <button class="mode-tab" id="tab-infer" onclick="switchMode('infer')">
          <span data-i18n="chat.mode.infer">Inference</span>
        </button>
        <button class="mode-tab" id="tab-research" onclick="switchMode('research')">
          <span data-i18n="chat.mode.research">Research</span>
        </button>
      </div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title" data-i18n="chat.desc.title">Description</div>
      <div class="mode-desc" id="modeDesc"></div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title" data-i18n="chat.options.title">Options</div>
      <div class="top-k-row">
        <label for="topK" data-i18n="chat.topk">Top-K:</label>
        <input type="number" id="topK" class="form-input" value="10" min="1" max="50" />
      </div>
      <div class="top-k-row" style="margin-top:8px;">
        <label for="maxRounds" data-i18n="chat.rounds">Rounds:</label>
        <input type="number" id="maxRounds" class="form-input" value="5" min="1" max="10" />
      </div>
    </div>
    <div class="sidebar-section" style="margin-top:auto; padding-top:12px; border-top:1px solid var(--border);">
      <button class="btn btn-ghost btn-sm" style="width:100%;" onclick="clearHistory()" data-i18n="chat.clear">Clear Chat</button>
    </div>
  </div>

  <!-- Main chat area -->
  <div class="chat-main">
    <div class="chat-header">
      <span style="font-weight:600;" id="chatModeLabel"></span>
      <span style="font-size:12px; color:var(--text-muted);" id="chatModeHint"></span>
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="empty-state" id="emptyState">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <p id="emptyStateText"></p>
      </div>
    </div>

    <div class="chat-input-area">
      <div class="chat-input-row">
        <textarea
          id="chatInput"
          class="chat-textarea"
          rows="1"
          onkeydown="handleKey(event)"
          oninput="autoResize(this)"
        ></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentMode = 'qa';
let isLoading = false;

function getModeDescriptions() {
  return {
    qa: t('chat.mode.qa.desc'),
    infer: t('chat.mode.infer.desc'),
    research: t('chat.mode.research.desc'),
  };
}
function getModeLabels() {
  return {
    qa: t('chat.mode.qa.label'),
    infer: t('chat.mode.infer.label'),
    research: t('chat.mode.research.label'),
  };
}
function getModeHints() {
  return {
    qa: t('chat.mode.qa.hint'),
    infer: t('chat.mode.infer.hint'),
    research: t('chat.mode.research.hint'),
  };
}
function getPlaceholders() {
  return {
    qa: t('chat.placeholder.qa'),
    infer: t('chat.placeholder.infer'),
    research: t('chat.placeholder.research'),
  };
}

function refreshModeUI() {
  document.getElementById('modeDesc').textContent = getModeDescriptions()[currentMode];
  document.getElementById('chatModeLabel').textContent = getModeLabels()[currentMode];
  document.getElementById('chatModeHint').textContent = getModeHints()[currentMode];
  document.getElementById('chatInput').placeholder = getPlaceholders()[currentMode];
  const emptyText = document.getElementById('emptyStateText');
  if (emptyText) emptyText.textContent = t('chat.empty');
}

function switchMode(mode) {
  currentMode = mode;
  ['qa', 'infer', 'research'].forEach(m => {
    document.getElementById(`tab-${m}`).classList.toggle('active', m === mode);
  });
  refreshModeUI();
}

// Re-render mode text when language changes
document.addEventListener('localechange', refreshModeUI);

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function clearHistory() {
  const msgs = document.getElementById('chatMessages');
  msgs.innerHTML = `<div class="empty-state" id="emptyState">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <p id="emptyStateText">${t('chat.empty')}</p>
  </div>`;
}

async function sendMessage() {
  if (isLoading) return;
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;

  const emptyState = document.getElementById('emptyState');
  if (emptyState) emptyState.remove();

  appendMessage('user', text);
  input.value = '';
  input.style.height = 'auto';

  const typingId = appendTyping();
  isLoading = true;
  document.getElementById('sendBtn').disabled = true;

  try {
    let result;
    if (currentMode === 'qa') {
      const topK = parseInt(document.getElementById('topK').value) || 10;
      const data = await apiFetch('/api/query', {
        method: 'POST',
        body: JSON.stringify({ question: text, top_k: topK }),
      });
      result = data.result;
      removeTyping(typingId);
      appendAssistantQA(result);

    } else if (currentMode === 'infer') {
      const maxRounds = parseInt(document.getElementById('maxRounds').value) || 5;
      const data = await apiFetch('/api/infer', {
        method: 'POST',
        body: JSON.stringify({ topic: text, max_rounds: maxRounds }),
      });
      result = data.result;
      removeTyping(typingId);
      appendAssistantInfer(result);

    } else if (currentMode === 'research') {
      const data = await apiFetch('/api/research', {
        method: 'POST',
        body: JSON.stringify({ topic: text }),
      });
      result = data.result;
      removeTyping(typingId);
      appendAssistantResearch(result);
    }
  } catch (err) {
    removeTyping(typingId);
    appendMessage('assistant', `${t('chat.error')} ${err.message}`);
  }

  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
  input.focus();
}

function appendMessage(role, text) {
  const msgs = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = `message ${role}`;
  div.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

function appendAssistantQA(result) {
  const msgs = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'message assistant';
  const answer = result.answer || '';
  const sources = result.sources || [];
  const chunks = result.chunks_used || 0;

  let sourcesHtml = '';
  if (sources.length) {
    sourcesHtml = `<div class="sources-chips">${sources.map(s => `<span class="source-chip">${escapeHtml(s)}</span>`).join('')}</div>`;
  }
  div.innerHTML = `
    <div class="bubble">${escapeHtml(answer)}</div>
    ${sourcesHtml}
    <div class="message-meta">${t('chat.retrieved', { n: chunks })}</div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function appendAssistantInfer(result) {
  const msgs = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'message assistant';
  const insight = result.insight || '';
  const queries = result.queries_used || [];
  const sources = result.sources || [];

  let queriesHtml = '';
  if (queries.length) {
    queriesHtml = `<div class="think-block">${t('chat.searched')} ${queries.map(q => `"${escapeHtml(q)}"`).join(', ')}</div>`;
  }
  let sourcesHtml = '';
  if (sources.length) {
    sourcesHtml = `<div class="sources-chips">${sources.map(s => `<span class="source-chip">${escapeHtml(s)}</span>`).join('')}</div>`;
  }
  div.innerHTML = `
    ${queriesHtml}
    <div class="bubble">${escapeHtml(insight)}</div>
    ${sourcesHtml}`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function appendAssistantResearch(result) {
  const msgs = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'message assistant';
  const coverage = result.coverage || 'unknown';
  const gaps = result.gaps || [];
  const suggestions = result.suggestions || [];
  const knowledge = result.current_knowledge || '';
  const sources = result.sources || [];

  const coverageColor = coverage === 'high' ? '#22c55e' : coverage === 'medium' ? '#f59e0b' : '#ef4444';

  let gapsHtml = gaps.length ? `<br/><strong>${t('chat.gaps')}</strong><ul>${gaps.slice(0,5).map(g => `<li>${escapeHtml(g)}</li>`).join('')}</ul>` : '';
  let suggestionsHtml = suggestions.length ? `<strong>${t('chat.suggestions')}</strong><ul>${suggestions.slice(0,5).map(s => `<li>${escapeHtml(s)}</li>`).join('')}</ul>` : '';
  let sourcesHtml = sources.length ? `<div class="sources-chips">${sources.map(s => `<span class="source-chip">${escapeHtml(s)}</span>`).join('')}</div>` : '';

  div.innerHTML = `
    <div class="bubble">
      <span style="font-weight:600; color:${coverageColor};">${t('chat.coverage')} ${coverage}</span>
      <br/><br/>
      ${escapeHtml(knowledge).slice(0, 600)}${knowledge.length > 600 ? '…' : ''}
      ${gapsHtml}
      ${suggestionsHtml}
    </div>
    ${sourcesHtml}`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function appendTyping() {
  const msgs = document.getElementById('chatMessages');
  const id = 'typing-' + Date.now();
  const div = document.createElement('div');
  div.className = 'message assistant';
  div.id = id;
  div.innerHTML = `<div class="bubble" style="padding:8px 16px;"><div class="typing-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return id;
}

function removeTyping(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/\n/g, '<br/>');
}

// Init mode UI after i18n is ready (DOMContentLoaded fires applyLocale first)
document.addEventListener('localechange', () => refreshModeUI());
document.addEventListener('DOMContentLoaded', () => refreshModeUI());
</script>
{% endblock %}
