{% extends "base.html" %}
{% set active = "graph" %}

{% block title %}Knowledge Graph – KnowledgeClaw{% endblock %}

{% block head %}
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
  .main-content { padding: 0; display: flex; flex-direction: column; height: calc(100vh - 56px); overflow: hidden; }
  .graph-toolbar { display: flex; align-items: center; gap: 12px; padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .graph-wrap { display: flex; flex: 1; overflow: hidden; }
  #graph-canvas { flex: 1; background: var(--bg); cursor: grab; }
  #graph-canvas:active { cursor: grabbing; }
  #details-panel { width: 280px; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 16px; display: none; flex-shrink: 0; }
  #details-panel.open { display: block; }
  .node { cursor: pointer; }
  .node circle { stroke-width: 2; transition: r 0.15s; }
  .node:hover circle { stroke-width: 3; }
  .node text { font-size: 11px; fill: var(--text); pointer-events: none; }
  .link { stroke: var(--border); stroke-opacity: 0.6; stroke-width: 1.2; fill: none; }
  .link.highlighted { stroke: var(--primary); stroke-opacity: 1; stroke-width: 2; }
  .node.highlighted circle { stroke: var(--primary) !important; stroke-width: 3 !important; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-muted); }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .detail-section { margin-bottom: 14px; }
  .detail-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 4px; }
  .detail-value { font-size: 13px; color: var(--text); word-break: break-word; }
  .detail-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; margin-top: 2px; }
  .badge-entity { background: rgba(99,102,241,0.2); color: #818cf8; }
  .badge-hyperedge { background: rgba(251,146,60,0.2); color: #fb923c; }
  .badge-unknown { background: var(--border); color: var(--text-muted); }
  .graph-empty { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; color: var(--text-muted); pointer-events: none; }
</style>
{% endblock %}

{% block content %}
<!-- Toolbar -->
<div class="graph-toolbar">
  <div class="form-row" style="flex:1; max-width:320px; margin:0;">
    <input type="text" id="searchInput" class="form-input form-input-sm" data-i18n-placeholder="graph.search.placeholder" placeholder="Filter nodes…" oninput="filterNodes(this.value)" />
  </div>
  <button class="btn btn-ghost btn-sm" onclick="resetZoom()" data-i18n="graph.reset">Reset View</button>
  <button class="btn btn-ghost btn-sm" onclick="loadGraph()" data-i18n="graph.refresh">Refresh</button>
  <div style="flex:1"></div>
  <!-- Legend -->
  <div style="display:flex; gap:14px;">
    <div class="legend-item"><div class="legend-dot" style="background:#6366f1"></div><span data-i18n="graph.legend.entity">Entity</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:#f97316"></div><span data-i18n="graph.legend.hyperedge">Hyperedge</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:#6b7280"></div><span data-i18n="graph.legend.unknown">Unknown</span></div>
  </div>
  <span id="graphStats" style="font-size:12px; color:var(--text-muted); white-space:nowrap;"></span>
</div>

<!-- Graph + details -->
<div class="graph-wrap">
  <svg id="graph-canvas"></svg>
  <div id="details-panel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
      <strong style="font-size:14px;" data-i18n="graph.details.title">Node Details</strong>
      <button class="btn btn-ghost btn-sm" onclick="closeDetails()">✕</button>
    </div>
    <div class="detail-section">
      <div class="detail-label" data-i18n="graph.details.type">Type</div>
      <div class="detail-value"><span id="detail-type-badge" class="detail-badge"></span></div>
    </div>
    <div class="detail-section">
      <div class="detail-label" data-i18n="graph.details.label">Label</div>
      <div class="detail-value" id="detail-label"></div>
    </div>
    <div class="detail-section">
      <div class="detail-label" data-i18n="graph.details.source">Source</div>
      <div class="detail-value" id="detail-source"></div>
    </div>
    <div class="detail-section">
      <div class="detail-label" data-i18n="graph.details.degree">Degree</div>
      <div class="detail-value" id="detail-degree"></div>
    </div>
    <div class="detail-section">
      <div class="detail-label" data-i18n="graph.details.connections">Connections</div>
      <div id="detail-connections" style="font-size:12px; color:var(--text-muted); max-height:200px; overflow-y:auto;"></div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/graph.js"></script>
{% endblock %}
