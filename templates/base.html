<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}KnowledgeClaw{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/main.css" />
  <style>
    .lang-switcher { display:flex; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:6px; overflow:hidden; margin-right:6px; }
    .lang-btn { padding:4px 10px; font-size:12px; font-weight:600; border:none; background:transparent; color:var(--text-muted); cursor:pointer; transition:all 0.15s; line-height:1.6; }
    .lang-btn.active { background:var(--primary); color:#fff; }
    .lang-btn:hover:not(.active) { color:var(--text); }
  </style>
  <script src="/static/js/i18n.js"></script>
  {% block head %}{% endblock %}
</head>
<body>

<!-- ===== Navigation ===== -->
<nav class="navbar">
  <div class="nav-brand">
    <span class="nav-logo">⚡</span>
    <span class="nav-title">KnowledgeClaw</span>
  </div>
  <ul class="nav-links">
    <li><a href="/" class="nav-link {% if active == 'dashboard' %}active{% endif %}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      <span data-i18n="nav.dashboard">Dashboard</span>
    </a></li>
    <li><a href="/graph" class="nav-link {% if active == 'graph' %}active{% endif %}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
      <span data-i18n="nav.graph">Graph</span>
    </a></li>
    <li><a href="/chat" class="nav-link {% if active == 'chat' %}active{% endif %}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span data-i18n="nav.chat">Chat</span>
    </a></li>
  </ul>
  <div class="lang-switcher">
    <button class="lang-btn" data-lang="en" onclick="applyLocale('en')">EN</button>
    <button class="lang-btn" data-lang="zh" onclick="applyLocale('zh')">中</button>
  </div>
  <button class="theme-toggle" id="themeToggle" title="Toggle theme">
    <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
</nav>

<!-- ===== Main Content ===== -->
<main class="main-content">
  {% block content %}{% endblock %}
</main>

<!-- ===== Toast Container ===== -->
<div id="toast-container"></div>

<script>
// Theme toggle
const html = document.documentElement;
const btn = document.getElementById('themeToggle');

// Load saved theme
const savedTheme = localStorage.getItem('oc-theme') || 'dark';
html.setAttribute('data-theme', savedTheme);

btn.addEventListener('click', () => {
  const current = html.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('oc-theme', next);
});

// Toast helper
function showToast(msg, type = 'info') {
  const tc = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  toast.textContent = msg;
  tc.appendChild(toast);
  setTimeout(() => toast.classList.add('show'), 10);
  setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(() => tc.removeChild(toast), 300);
  }, 3500);
}

// Global fetch helper with error handling
async function apiFetch(url, opts = {}) {
  try {
    const res = await fetch(url, {
      headers: { 'Content-Type': 'application/json' },
      ...opts,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
    return data;
  } catch (err) {
    showToast(err.message, 'error');
    throw err;
  }
}
</script>

{% block scripts %}{% endblock %}
</body>
</html>
